<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* README banner (1400x560); with ?og, the 1200x630 social image. */
  .canvas {
    width: 1400px; height: 560px;
    background-color: var(--mint);
    background-image:
      radial-gradient(rgba(16, 48, 43, 0.12) 1.4px, transparent 1.5px),
      linear-gradient(120deg, #a6f9f0 0%, #5bdccd 45%, #32ccbc 100%);
    background-size: 24px 24px, 100% 100%;
    background-position: 8px 8px, 0 0;
  }
  .left { position: absolute; left: 80px; top: 78px; width: 600px; z-index: 2; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; filter: drop-shadow(4px 4px 0 rgba(16, 48, 43, 0.9)); }
  .brand span { font: 800 46px/1 var(--head); font-variation-settings: 'opsz' 96; letter-spacing: -0.04em; }
  .headline { font-size: 58px; margin-top: 30px; }
  .sub { font-size: 21px; color: #0f4a43; margin-top: 24px; max-width: 520px; }
  .tags { display: flex; gap: 10px; margin-top: 24px; }

  .window {
    position: absolute; left: 690px; top: 54px; width: 690px;
    transform: rotate(-2deg); transform-origin: top left;
    filter: drop-shadow(0 26px 40px rgba(16, 48, 43, 0.35));
  }
  .window img { display: block; margin: -24px; width: calc(100% + 48px); }

  .dock {
    position: absolute; left: 590px; top: 352px; z-index: 3;
    display: flex; align-items: center; gap: 14px; padding: 14px 18px;
    transform: rotate(1.5deg);
  }
  .dock .sep { width: 2px; height: 64px; background: var(--line); margin: 0 4px; }
  .dock .tile { --size: 76px; }

  .grass { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #1f8f83; z-index: 1; }
  .grass::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 10px; background: repeating-linear-gradient(90deg, #1f8f83 0 10px, transparent 10px 20px); }
  .bunny { position: absolute; bottom: 30px; z-index: 2; width: 64px; height: 64px; }

  .og .canvas { width: 1200px; height: 630px; }
  .og .left { left: 64px; top: 70px; width: 560px; }
  .og .headline { font-size: 56px; }
  .og .window { left: 600px; top: 120px; width: 640px; }
  .og .dock { left: 500px; top: 420px; }
</style>
</head>
<body>
<script>if (location.search.includes('og')) document.body.classList.add('og')</script>
<div class="canvas">
  <div class="left">
    <div class="brand"><img class="mark" src="../../apps/claude-switch/public/icon.svg" alt=""><span>claude-switch</span></div>
    <h1 class="headline">Every Claude account,<br>its own <span class="boxed">Dock tile</span></h1>
    <p class="sub">Claude Desktop and Claude Code for each of your accounts, side by side on one Mac.</p>
    <div class="tags"><span class="tag">Free · open source</span><span class="tag">macOS</span></div>
  </div>

  <div class="window"><img src="../../apps/landing/public/screenshot-light.png" alt=""></div>

  <div class="dock panel">
    <div class="tile"><img src=".cache/claude.png" alt=""></div>
    <div class="sep"></div>
    <div class="tile" data-color="steel"><img src=".cache/claude.png" alt=""></div>
    <div class="tile" data-color="sage"><img src=".cache/claude.png" alt=""></div>
    <div class="tile" data-color="mauve"><img src=".cache/claude.png" alt=""></div>
  </div>

  <div class="grass"></div>
  <img class="mark bunny" style="left: 486px" src="../../apps/claude-switch/public/icon.svg" alt="">
</div>
</body>
</html>
