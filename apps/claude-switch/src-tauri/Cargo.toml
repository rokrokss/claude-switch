[package]
name = "claude-switch"
version = "2.0.0"
description = "Run several Claude accounts on one Mac, each with its own Desktop launcher, CLI wrapper and Dock tile."
authors = ["Hyungrok Kim"]
repository = "https://github.com/rokrokss/claude-switch"
license = "MIT"
edition = "2021"
# The workspace below adds a second binary (`profile-shim`), which makes a bare
# `cargo run` (and `tauri dev`) ambiguous without this.
default-run = "claude-switch"

# `profile-shim` is the executable of every generated wrapper bundle. build.rs
# compiles it for the target being built and the app embeds the bytes; being a
# default member keeps its tests, clippy and rustfmt inside the usual commands.
[workspace]
members = ["shim"]
default-members = [".", "shim"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claude_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
dirs = "6"
icns = "0.4.0"
plist = "1.9.0"
trash = "5.2.6"
tauri-plugin-clipboard-manager = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "socks"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "process", "sync", "time", "net"] }
# The local API (local_api), which serves usage on 127.0.0.1 when turned on.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
portable-pty = "0.9.0"
# Codex compresses finished rollouts to `.jsonl.zst`; the spend scan reads them.
ruzstd = "0.8"
profile-shim = { path = "shim" }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

# Focus / reopen a specific already-running Claude instance by PID
# (single-instance launch behaviour). Already present transitively via tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSAttributedString",
    "NSBitmapImageRep",
    "NSColor",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSHapticFeedback",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusItem",
    "NSStringDrawing",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = [
    "NSAppleEventDescriptor",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "objc2-core-services",
    "libc",
    "NSDate",
    "NSError",
    "NSString",
    "NSURL",
    "NSUserDefaults",
] }
# Post notifications as claude-switch, and hear about clicks on them.
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
# Hand the `claude://` scheme to claude-switch while a profile signs in, the way
# Claude takes it (launchers::link_handler). Already present via objc2-foundation.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "LaunchServices", "LSInfo"] }

# Profile for the `profile-shim` binary build.rs embeds. One copy is written
# into every wrapper bundle, so it is built for size.
[profile.shim]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

